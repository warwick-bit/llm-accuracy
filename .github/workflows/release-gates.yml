name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest "ruff==0.15.2"

      - name: Lint
        run: python3 -m ruff check .

      - name: Run distribution tests
        run: python3 -m pytest -q

      - name: Validate manifests and hook syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path(".claude-plugin/marketplace.json"),
              Path("plugins/llm-accuracy/.claude-plugin/plugin.json"),
              Path("plugins/llm-accuracy/hooks/hooks.json"),
              Path("plugins/session-ledger/.claude-plugin/plugin.json"),
              Path("plugins/session-ledger/hooks/hooks.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          PY
          find plugins -path '*/hooks/*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Enforce distribution boundary
        run: |
          python3 scripts/check_distribution_boundary.py plugins/llm-accuracy
          python3 scripts/check_distribution_boundary.py plugins/session-ledger --profile session-ledger

  release-gates:
    name: release-gates
    runs-on: ubuntu-latest
    needs: gates
    if: always()
    steps:
      - name: Require every gate leg to pass
        run: test "${{ needs.gates.result }}" = "success"
