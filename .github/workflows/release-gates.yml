name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest "ruff==0.15.2"

      - name: Lint
        run: python3 -m ruff check .

      - name: Run distribution tests
        run: python3 -m pytest -q

      - name: Validate manifests and hook syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path(".claude-plugin/marketplace.json"),
              Path("plugins/llm-accuracy/.claude-plugin/plugin.json"),
              Path("plugins/llm-accuracy/hooks/hooks.json"),
              Path("plugins/llm-accuracy/references/evidence-receipt.schema.json"),
              Path("plugins/deterministic-data/.claude-plugin/plugin.json"),
              Path("plugins/deterministic-data/references/catalogue.schema.json"),
              Path("plugins/deterministic-data/references/evidence-receipt.schema.json"),
              Path("plugins/deterministic-data/catalogues/example.catalogue.json"),
              Path("plugins/session-ledger/.claude-plugin/plugin.json"),
              Path("plugins/session-ledger/hooks/hooks.json"),
              Path("plugins/evidence-memory/.claude-plugin/plugin.json"),
              Path("plugins/evidence-memory/hooks/hooks.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          PY
          find plugins -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Enforce distribution boundary
        run: |
          python3 scripts/check_distribution_boundary.py plugins/llm-accuracy
          python3 scripts/check_distribution_boundary.py plugins/deterministic-data --profile deterministic-data
          python3 scripts/check_distribution_boundary.py plugins/session-ledger --profile session-ledger
          python3 scripts/check_distribution_boundary.py plugins/evidence-memory --profile evidence-memory

  windows:
    name: Windows Git Bash (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Select native Git Bash
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "Git Bash is required" }
          "HOOK_TEST_SHELL=$bash" >> $env:GITHUB_ENV
      - name: Exercise native Windows hooks, validators, and locking
        run: >-
          python -m pytest -q
          tests/test_python_selection.py
          tests/test_accuracy_wiring.py
          tests/test_custom_triggers.py
          tests/test_technical_harness.py
          tests/test_session_memory.py
          tests/test_session_ledger_wiring.py
          tests/test_session_ledger_locking.py
          tests/test_session_ledger_host_smoke.py
          tests/test_receipt_stdin.py
          tests/test_evidence_receipts.py
          tests/test_deterministic_data.py

      - name: Verify atomic archive replacement
        run: >-
          python -m pytest -q tests/test_release_archive.py
          -k "failed_archive_build or successful_archive"

  release-gates:
    name: release-gates
    runs-on: ubuntu-latest
    needs: [gates, windows]
    if: always()
    steps:
      - name: Require every gate leg to pass
        run: test "${{ needs.gates.result }}" = "success" && test "${{ needs.windows.result }}" = "success"
