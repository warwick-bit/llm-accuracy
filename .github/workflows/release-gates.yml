name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "*--v*"

permissions:
  contents: read

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest "ruff==0.15.2"

      - name: Lint
        run: python3 -m ruff check .

      - name: Run distribution tests
        run: python3 -m pytest -q

      - name: Validate current compatibility evidence
        run: python3 scripts/check_compatibility.py

      - name: Validate manifests and hook syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path(".claude-plugin/marketplace.json"),
              Path("plugins/llm-accuracy/.claude-plugin/plugin.json"),
              Path("plugins/llm-accuracy/hooks/hooks.json"),
              Path("plugins/llm-accuracy/references/evidence-receipt.schema.json"),
              Path("plugins/deterministic-data/.claude-plugin/plugin.json"),
              Path("plugins/deterministic-data/references/catalogue.schema.json"),
              Path("plugins/deterministic-data/references/evidence-receipt.schema.json"),
              Path("plugins/deterministic-data/catalogues/example.catalogue.json"),
              Path("plugins/session-ledger/.claude-plugin/plugin.json"),
              Path("plugins/session-ledger/hooks/hooks.json"),
              Path("plugins/evidence-memory/.claude-plugin/plugin.json"),
              Path("plugins/evidence-memory/hooks/hooks.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          PY
          find plugins -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Enforce distribution boundary
        run: |
          python3 scripts/check_distribution_boundary.py plugins/llm-accuracy
          python3 scripts/check_distribution_boundary.py plugins/deterministic-data --profile deterministic-data
          python3 scripts/check_distribution_boundary.py plugins/session-ledger --profile session-ledger
          python3 scripts/check_distribution_boundary.py plugins/evidence-memory --profile evidence-memory

  windows:
    name: Windows Git Bash (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Select native Git Bash
        shell: pwsh
        run: |
          $bash = "C:\Program Files\Git\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "Git Bash is required" }
          "HOOK_TEST_SHELL=$bash" >> $env:GITHUB_ENV
      - name: Exercise native Windows hooks, validators, and locking
        run: >-
          python -m pytest -q
          tests/test_python_selection.py
          tests/test_hook_exec.py
          tests/test_accuracy_wiring.py
          tests/test_custom_triggers.py
          tests/test_technical_harness.py
          tests/test_session_memory.py
          tests/test_session_ledger_wiring.py
          tests/test_session_ledger_locking.py
          tests/test_session_ledger_host_smoke.py
          tests/test_receipt_stdin.py
          tests/test_evidence_receipts.py
          tests/test_deterministic_data.py

      - name: Verify atomic archive replacement
        run: >-
          python -m pytest -q tests/test_release_archive.py
          -k "failed_archive_build or successful_archive"

  windows-native:
    name: Windows without Git Bash (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    env:
      HOOK_TEST_SHELL: ""
      REQUIRE_NATIVE_WINDOWS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Remove Git Bash from hook PATH
        shell: pwsh
        run: |
          $clean = ($env:PATH -split ';' | Where-Object { $_ -notmatch '[/\\]Git[/\\](bin|usr[/\\]bin)' }) -join ';'
          "PATH=$clean" >> $env:GITHUB_ENV
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Exercise native executable hooks and persistence
        run: >-
          python -m pytest -q --junitxml=native-hooks.xml
          tests/test_hook_exec.py tests/test_accuracy_wiring.py
          tests/test_session_ledger_wiring.py tests/test_session_ledger_locking.py
          tests/test_evidence_memory_wiring.py tests/test_session_memory.py
          tests/test_receipt_stdin.py tests/test_evidence_receipts.py
      - name: Require actual native hook coverage
        run: python scripts/check_native_hook_tests.py native-hooks.xml

  macos:
    name: macOS (py3.14)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest "ruff==0.15.2"
      - name: Lint
        run: python3 -m ruff check .
      - name: Run distribution tests
        run: python3 -m pytest -q
      - name: Enforce distribution boundary
        run: |
          python3 scripts/check_distribution_boundary.py plugins/llm-accuracy
          python3 scripts/check_distribution_boundary.py plugins/deterministic-data --profile deterministic-data
          python3 scripts/check_distribution_boundary.py plugins/session-ledger --profile session-ledger
          python3 scripts/check_distribution_boundary.py plugins/evidence-memory --profile evidence-memory

  publication:
    name: marketplace-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Require installed QA before marketplace publication
        env:
          PUBLICATION_EVENT: ${{ github.event_name }}
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$PUBLICATION_EVENT" = "pull_request" ]; then
            python3 scripts/check_marketplace_publication.py --base-ref "$PUBLICATION_BASE_SHA"
          else
            python3 scripts/check_marketplace_publication.py --release
          fi

  release-gates:
    name: release-gates
    runs-on: ubuntu-latest
    needs: [gates, windows, windows-native, macos, publication]
    if: always()
    steps:
      - name: Require every gate leg to pass
        run: test "${{ needs.gates.result }}" = "success" && test "${{ needs.windows.result }}" = "success" && test "${{ needs.windows-native.result }}" = "success" && test "${{ needs.macos.result }}" = "success" && test "${{ needs.publication.result }}" = "success"
